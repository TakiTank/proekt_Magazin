{% extends "base.html" %}
{% load static %}
{% block title %}{{ ui.password }} - Hop & Barley{% endblock %}
{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="{{ ui.background_pattern_alt }}">
  </div>
  <div class="auth-form-container">
    <div class="auth-container">
      <div class="Legend">
        <h1 class="auth-title">{{ ui.password }}</h1>
      </div>
      <p>{{ ui.reset_inbox }}</p>
      <div class="ButtonGroup ButtonGroup--center">
        <a href="{% url 'users:login' %}" class="button button--primary">{{ ui.back_to_sign_in }}</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
