{% extends "base.html" %}
{% load static %}
{% block title %}{{ ui.reset_password }} - Hop & Barley{% endblock %}
{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="{{ ui.background_pattern_alt }}">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--forgot-password">
      <div class="Legend">
        <h1 class="auth-title">{{ ui.forgot_password }}</h1>
      </div>

      <form class="auth-form" id="forgot-password-form" method="post">
        {% csrf_token %}
        <div class="InputField">
          <label for="{{ form.email.id_for_label }}">{{ ui.email }}</label>
          <input type="email" name="email" id="{{ form.email.id_for_label }}"
                 class="Input" placeholder="{{ ui.email_placeholder }}" required>
          {% if form.email.errors %}<div class="form-errors">{{ form.email.errors }}</div>{% endif %}
        </div>

        <div class="ButtonGroup ButtonGroup--center">
          <a href="{% url 'users:login' %}" class="button button--cancel">{{ ui.cancel }}</a>
          <button type="submit" class="button button--primary">{{ ui.reset_password }}</button>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
